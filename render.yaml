# Render Blueprint for Engine. Deploy with New > Blueprint in the Render dashboard.
# Secrets marked sync: false are asked for once, in the dashboard, and never stored here.
#
# Free plan for the hackathon demo. Two things to know:
# - It sleeps after 15 minutes idle, so the first visit after a pause takes about a minute.
# - There is no persistent disk, so data resets on each deploy or restart and the
#   sandbox demo company comes back. For real use, switch to plan: starter and add
#   a disk mounted at /var/data with DATA_DIR=/var/data.

services:
  - type: web
    name: engine
    runtime: docker
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/mcp
    buildFilter:
      paths:
        - web/**
    envVars:
      - key: DATA_DIR
        value: /tmp/engine-data
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_CLIENT_EMAIL
        sync: false
      - key: PAYPAL_FREELANCER_EMAIL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      # Optional. Elastic for Brain search once the data grows; local search otherwise.
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      # Optional. Read-only token, only needed to connect private GitHub repos.
      - key: GITHUB_TOKEN
        sync: false
      # Token a freelancer's AI agent uses for /api/mcp. Shown on /app/connect
      # because this is a public sandbox demo; remove ENGINE_SHOW_DOER_TOKEN for real use.
      - key: ENGINE_DOER_TOKEN
        generateValue: true
      - key: ENGINE_SHOW_DOER_TOKEN
        value: "1"
      # For the daily run, if you add a cron job that calls /api/engine/cron?daily=1.
      - key: CRON_SECRET
        generateValue: true
      # Optional. Set it to lock funding, sign-off and Brain edits behind /app/unlock.
      - key: ENGINE_OWNER_KEY
        sync: false
