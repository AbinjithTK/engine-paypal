# Render's free plan sleeps after 15 idle minutes. This visits the demo every
# 10 minutes so judges don't wait for a cold start. Remove it on a paid plan.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the live app
        run: curl -fsS -o /dev/null -w "%{http_code} in %{time_total}s\n" --max-time 120 https://engine-xjur.onrender.com/api/mcp
